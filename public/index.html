<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outpost Run (prototipo)</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: .8rem; background: #e8eefc; }
    .badge.snapshot { background: #fff1d6; }
    li { margin: .4rem 0; }
  </style>
</head>
<body>
  <h1>Outpost Run</h1>
  <p>Pantalla de arranque de prueba: confirma que el juego puede leer la API local. Reemplázala por el juego real.</p>
  <h2>Escenarios reales disponibles</h2>
  <p id="mode"></p>
  <ul id="list"><li>Cargando…</li></ul>
  <p><small>Datos: NASA CCMC DONKI. NASA y CSA no patrocinan ni respaldan este proyecto.</small></p>

  <script type="module">
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    try {
      const res = await fetch("/api/scenarios");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const { meta, scenarios } = await res.json();
      const rawMode = res.headers.get("X-Data-Mode") ?? meta?.mode;
      const modeClass = rawMode === "live" ? "live" : "snapshot";
      const day = String(meta?.retrievedAt ?? "").slice(0, 10);
      document.getElementById("mode").innerHTML =
        `Origen: <span class="badge ${modeClass}">${rawMode === "live" ? "en vivo" : "copia guardada"}</span> (${esc(day)})`;
      document.getElementById("list").innerHTML = scenarios
        .map((s) => `<li><strong>${esc(s.name?.es)}</strong> — ${esc(s.difficulty)}, ${esc(s.windowStart)} a ${esc(s.windowEnd)}, amenaza máx. ${esc(s.summary?.maxThreat)}</li>`)
        .join("");
    } catch (err) {
      document.getElementById("mode").textContent = "No se pudo consultar la API local.";
      document.getElementById("list").textContent = String(err?.message ?? err);
    }
  </script>
</body>
</html>
